content:
  - name: articles
    label: Artículos
    type: collection
    path: content/posts
    filename: "{slug}.md"
    view:
      fields: [title, date, category, published]
      primary: title
      sort: [date, desc]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: slug
        label: Dirección (slug)
        type: string
        required: true
      - name: date
        label: Fecha
        type: date
        required: true
      - name: category
        label: Categoría
        type: string
      - name: excerpt
        label: Resumen
        type: string
      - name: readTime
        label: Tiempo de lectura
        type: string
      - name: published
        label: Publicado
        type: boolean
      - name: body
        label: Contenido
        type: rich-text
